name: atomforge-local
services:
  runner:
    build:
      context: .
      dockerfile: app/runner/Dockerfile
    image: atomforge-runner:local-dev
    restart: unless-stopped
    networks: [verification]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 12s
      start_period: 30s
      retries: 3
  gateway:
    image: nginx:latest
    restart: unless-stopped
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    user: nginx
    read_only: true
    tmpfs: [/tmp]
    ports: ["127.0.0.1:8001:8001"]
    networks: [default, verification]
    volumes:
      - ./scripts/local-runner-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      runner:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://127.0.0.1:8001/ready > /dev/null"]
      interval: 15s
      timeout: 12s
      start_period: 15s
      retries: 3
networks:
  verification:
    internal: true
