name: atomforge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: atomforge:local
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/atomforge.db
      ATOMFORGE_DATA_DIR: /data
      CODEX_HOME: /data/codex
      ATOMFORGE_CODEX_BIN: /usr/local/bin/codex
      ENVIRONMENT: prod
      MGX_IGNORE_MODULE_INIT: "false"
      RUNNER_URL: http://runner:8001
    depends_on:
      runner:
        condition: service_healthy
    networks: [default, builds]
    ports:
      - "127.0.0.1:${ATOMFORGE_PORT:-8080}:8000"
    volumes:
      - atomforge-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/database/health', timeout=5); assert json.load(r)['status'] == 'healthy'; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).close()"
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  runner:
    build:
      context: .
      dockerfile: app/runner/Dockerfile
    image: atomforge-runner:local
    restart: unless-stopped
    networks: [builds]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 12s
      retries: 3
      start_period: 20s

volumes:
  atomforge-data:

networks:
  builds:
    internal: true
